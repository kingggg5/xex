<!doctype html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xexoria · Minotaur motion review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151b24;color:#ece6da;font:15px system-ui,sans-serif}canvas{width:100vw;height:100vh;display:block;touch-action:none}aside{position:fixed;left:20px;top:20px;width:285px;padding:18px;background:#111924ed;border:1px solid #776648;border-radius:10px}h1{font:600 22px Georgia,serif;margin:0 0 10px}p{font-size:13px;line-height:1.5;color:#bdc5ce}label{display:block;margin:12px 0 5px}select,button,input{font:inherit}select,button{background:#293646;color:#fff;border:1px solid #536479;border-radius:5px;padding:8px}select{width:100%}button{margin:6px 5px 0 0;cursor:pointer}input{width:100%}output{font-size:13px;display:block;margin-top:12px;color:#bdddd4}#status{white-space:pre-line}#fps{position:fixed;right:18px;top:14px;color:#cdd8e3;font:13px monospace}@media(max-width:700px){aside{top:auto;bottom:12px;left:12px;width:calc(100vw - 24px);padding:12px}aside p{display:none}h1{font-size:18px}label{display:inline-block;margin:5px}select{width:auto;max-width:48%}}
</style></head>
<body><canvas id="renderCanvas" aria-label="Minotaur 3D model with animated skeleton"></canvas><aside><h1>Xexoria · Minotaur</h1><p>ตรวจโมเดลและแอนิเมชันใน Babylon.js<br>ลากเพื่อหมุน · เลื่อนเพื่อซูม</p><label for="lod">รายละเอียดโมเดล</label><select id="lod"><option value="0">LOD0 · ระยะใกล้</option><option value="1" selected>LOD1 · ระยะเล่น</option><option value="2">LOD2 · ระยะไกล</option></select><label for="clip">ท่าเคลื่อนไหว</label><select id="clip"></select><div><button id="play">เล่น</button><button id="pause">หยุด</button><button id="front">ด้านหน้า</button><button id="side">ด้านข้าง</button><button id="player">มุมผู้เล่น</button></div><label for="frame">ตรวจเฟรม</label><input id="frame" type="range" min="0" max="120" step="1" value="0"><output id="status">กำลังโหลด…</output><p>ฉากตรวจ asset แยกจากเกม · ท่ายังไม่มี VFX<br>ยังไม่ได้ทดสอบประสิทธิภาพบนโทรศัพท์</p></aside><output id="fps"></output><script type="module" src="/src/minotaur-review.ts"></script></body>
</html>
