[package]
name = "xexoria-sweep"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
futures-util = "=0.3.34"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tokio-tungstenite = "=0.29.0"
uuid = { version = "=1.26.1", features = ["v4"] }

[profile.release]
debug = 1

# Standalone intentionally: the main server/client workspace and lock are untouched.
[workspace]
